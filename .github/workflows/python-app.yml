# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi
        python -m pip install flake8 pytest ruff
    - name: Lint with flake8
      run: |
        # Syntax errors and undefined names (fatal)
        flake8 scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Style warnings (non-fatal)
        flake8 scripts/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Lint with ruff
      run: |
        ruff check scripts/ || true
    - name: Test with pytest
      run: |
        pytest --co -q || true
